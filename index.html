<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaHunter</title>
    <style>
      html, body {
        width: 800px;
        height: 600px;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        overflow-y: auto;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        background:
          radial-gradient(ellipse 90% 40% at 50% -10%, rgba(105, 70, 251, 0.2) 0%, transparent 70%),
          #0b0914;
        box-shadow:
          inset 0 0 35px rgba(105, 70, 251, 0.14),
          inset 0 0 1px 1px rgba(105, 70, 251, 0.35);
        border-radius: 0;
      }
      ::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
